<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" type="image/x-icon" href="icons8-excel-48.png">
    <title>EXCEL COLUMN CONVERTER</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
        <h1>Excel Column Converter</h1>
        <p class="subtitle">Convert between column numbers and letters</p>

        <div class="converter-section">
            <label for="numberInput">Column Number (1-16384)</label>
            <input 
                type="number" 
                id="numberInput" 
                placeholder="e.g., 28" 
                min="1" 
                max="16384"
            >
            <div class="result">
                <span id="numberResult" class="result-empty">Enter a number above</span>
            </div>
        </div>

        <div class="divider"></div>

        <div class="converter-section">
            <label for="letterInput">Column Letters (A-XFD)</label>
            <input 
                type="text" 
                id="letterInput" 
                placeholder="e.g., AB" 
                style="text-transform: uppercase;"
            >
            <div class="result">
                <span id="letterResult" class="result-empty">Enter letters above</span>
            </div>
        </div>

        <div class="info">
            <strong>Excel limits:</strong> Columns range from A (1) to XFD (16,384)
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
